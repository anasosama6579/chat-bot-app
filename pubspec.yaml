name: chat_bot_app
description: "Chat Bot App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^2.17.0

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  flutter_svg: ^2.2.3
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  build_runner: ^2.10.5
  get_it: ^9.2.0
  json_serializable: ^6.12.0
  json_annotation: ^4.10.0
  dio: ^5.9.1
  retrofit: ^4.9.2
  retrofit_generator: ^10.2.1
  pretty_dio_logger: ^1.4.0
  flutter_bloc: ^9.1.1
  loading_animation_widget: ^1.3.0
  flutter_markdown: ^0.7.7+1
  mocktail: ^1.0.4

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
